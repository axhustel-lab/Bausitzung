<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {

      --ground: #141619; --surface: #1E2126; --surface-2: #262A30; --ink: #ECEEF1; --muted: #9AA3AE;
      --line: #2F343B; --line-strong: #454C55; --accent: #E5495F; --accent-ink: #FFFFFF; --accent-soft: #3B1C23;
      --good: #4CC48A; --good-soft: #1A3527; --warn: #E2B25A; --warn-soft: #3A2E12; --focus: #6C9BFF;

    --ground: #141619; --surface: #1E2126; --surface-2: #262A30; --ink: #ECEEF1; --muted: #9AA3AE;
    --line: #2F343B; --line-strong: #454C55; --accent: #E5495F; --accent-ink: #FFFFFF; --accent-soft: #3B1C23;
    --good: #4CC48A; --good-soft: #1A3527; --warn: #E2B25A; --warn-soft: #3A2E12; --focus: #6C9BFF;

  .brand .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .steps { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

  .step { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

  .lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; max-width: 60ch; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

  /* Variant cards */
  .variants { display: grid; gap: 10px; margin-top: 12px; }
  .vcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; box-shadow: var(--shadow); }
  .vcard:hover { border-color: var(--line-strong); }
  .vcard .t { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .vcard .k { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 500; }
  .vcard .d { color: var(--muted); font-size: 13.5px; }
  .project { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  @media (max-width: 460px) { .project { grid-template-columns: 1fr; } }

  /* Item cards */
  .items { display: grid; gap: 10px; }
  .item { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
  .item.out { background: var(--surface-2); border-style: dashed; }
  .item.out .fields, .item.out .preview, .item.out .opts { display: none; }
  .item.open-state { border-left: 3px solid var(--warn); }
  .item.star { border-color: var(--accent); }
  .item-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .item-h .l { font-weight: 600; font-size: 14.5px; }

  .item.star .l::before { content: "Nie vergessen"; display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; margin-right: 8px; vertical-align: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex: 0 0 auto; }
  .seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.on-in { background: var(--good-soft); color: var(--good); font-weight: 600; }
  .seg button.on-out { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .opts { display: grid; gap: 6px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
  .opt.sel { border-color: var(--ink); background: var(--surface-2); }
  .opt input { margin-top: 3px; accent-color: var(--accent); }
  .opt .ol { font-weight: 600; font-size: 13.5px; }
  .opt .od { font-size: 12.5px; color: var(--muted); }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 10px; }
  .field { display: grid; gap: 3px; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .field input, .field select, .field textarea, .pfield input { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink); font-size: 14px; }
  .field textarea { min-height: 56px; resize: vertical; }
  .preview { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; color: var(--ink); background: var(--surface-2); border-radius: 7px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
  .preview .ph { color: var(--accent); font-weight: 500; }
  .custom { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
  .custom textarea { width: 100%; min-height: 48px; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); resize: vertical; }
  .customs { display: grid; gap: 6px; }
  .cline { display: flex; gap: 8px; align-items: flex-start; font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 6px 10px; border-radius: 7px; }
  .cline span { flex: 1; white-space: pre-wrap; }


  /* Projekt, Teilnehmer, Fotos, Unterschrift */
  .card { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; margin-bottom: 10px; }

  .trow { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-items: end; }

  @media (max-width: 460px) { .trow { grid-template-columns: 1fr; } }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb { position: relative; width: 96px; height: 72px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .sig { width: 100%; max-width: 100%; aspect-ratio: 10 / 3; border: 1px dashed var(--line-strong); border-radius: 8px; background: #fff; touch-action: none; display: block; }
  .hint { font-size: 12.5px; color: var(--muted); align-self: center; }
  details.texts { margin-top: 18px; }
  details.texts summary { cursor: pointer; font-weight: 600; padding: 8px 0; color: var(--muted); }

  /* Buttons */
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.small { padding: 4px 10px; font-size: 12.5px; font-weight: 500; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.copied { background: var(--good-soft); border-color: var(--good); color: var(--good); }

  /* Bottom bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .bar .status { font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Output */
  .out-sec { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .out-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .out-h .t { font-weight: 600; }
  .out-h .t small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12.5px; }
  .lines { display: grid; }
  .line { display: flex; gap: 10px; align-items: flex-start; padding: 8px 14px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .line:last-child { border-bottom: 0; }
  .line .n { color: var(--muted); flex: 0 0 20px; font-variant-numeric: tabular-nums; }
  .line .tx { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .line .ph { color: var(--accent); font-weight: 500; }
  .line .cp { flex: 0 0 auto; }
  .notice { border-radius: var(--radius); padding: 10px 14px; font-size: 13.5px; margin-bottom: 12px; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.good { background: var(--good-soft); color: var(--good); }
  .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  .fallback { position: fixed; left: -9999px; top: 0; }
  .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
</style>

// ============================================================ Zustand
const KEY = "bausitzung-baukasten-v2";
const KEEP_KEY = "bausitzung-baukasten-keep";
let KEEP = {}; try { KEEP = JSON.parse(localStorage.getItem(KEEP_KEY) || "{}"); } catch (e) {}
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const FUNKTIONEN = ["Montagechef", "Bauleiter", "Bauherr", "Verwaltung", "Hauswart", "Architekt", "Demonteur", "Elektriker", "Baumeister", "Schlosser", "Maler", "Gipser", "Verkäufer AS", "Projektleiter AS", "Monteur", "Andere"];
const blankProj = () => ({ name: "", komNr: "", typ: "", strasse: "", plzOrt: "", datum: today(), ort: KEEP.ort || "Chur", gs: KEEP.gs || "AS-OS", vonName: KEEP.vonName || "", vonPos: KEEP.vonPos || "Installation Supervisor", vonTel: KEEP.vonTel || "" });
const blank = () => ({ variant: null, choose: true, step: 0, items: {}, fields: Object.assign({}, KEEP.fields || {}, KEEP.tresorCode ? { tresorCode: KEEP.tresorCode } : {}), custom: {}, photos: {}, proj: blankProj(), teiln: [], sign: KEEP.sign || "" });
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); S = Object.assign(blank(), o); S.proj = Object.assign(blankProj(), o.proj || {}); } } catch (e) {}
let storageFull = false;
function save() {
  try {
    const keepFields = {}; Object.keys(F).filter(k => F[k].keep).forEach(k => { if (S.fields[k]) keepFields[k] = S.fields[k]; });
    KEEP = Object.assign(KEEP, { fields: keepFields, ort: S.proj.ort, gs: S.proj.gs, vonName: S.proj.vonName, vonPos: S.proj.vonPos, vonTel: S.proj.vonTel, sign: S.sign });
    localStorage.setItem(KEEP_KEY, JSON.stringify(KEEP));
    localStorage.setItem(KEY, JSON.stringify(S)); storageFull = false;
  } catch (e) { storageFull = true; }
}

const itemsFor = (v, sec) => ITEMS.filter(i => i.v.includes(v) && (!sec || i.s === sec));
const secsFor = (v) => SECTIONS.filter(s => itemsFor(v, s.id).length);
const st = (id) => S.items[id] || (S.items[id] = { mode: null, opt: null });

function fmtDate(v, sep = ".") { if (!v) return ""; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? `${m[3]}${sep}${m[2]}${sep}${m[1]}` : v; }
function fieldVal(k) {
  const f = F[k]; let v = S.fields[k];
  if (v === undefined || v === "") v = f.d !== undefined ? f.d : (f.t === "select" ? f.o[0] : "");
  if (f.t === "date") v = fmtDate(v);
  return v;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Text rendern; html=true markiert leere Platzhalter
function render(tpl, fields, html) {
  return tpl.replace(/\{(_?\w+)\}/g, (m, k) => {
    if (k === "_demPartner") return S.variant === 1 ? "Demonteur" : "Monteur";
    const f = F[k]; if (!f) return m;
    const v = fieldVal(k);
    if (f.opt) { const pre = f.pre ?? ", "; return v ? (html ? esc(pre + v) : pre + v) : ""; }
    if (v) return html ? esc(v) : v;
    const ph = "[" + (f.ph || (f.t === "date" ? "Datum" : f.t === "time" ? "Uhrzeit" : f.l)) + "]";
    return html ? `<span class="ph">${esc(ph)}</span>` : ph;
  });
}
function itemText(it, html) {
  const s = st(it.id);
  if (it.opts) { const o = it.opts.find(o => o.id === s.opt); return o ? render(o.tpl, o.f, html) : ""; }
  return render(it.tpl, it.f, html);
}
function itemState(it) { const s = st(it.id); if (s.mode === "out") return "out"; if (s.mode === "in" && (!it.opts || s.opt)) return "in"; return "open"; }
function applyDefaults(v) {
  itemsFor(v).forEach(it => { const s = st(it.id); if (it.opts && s.opt && !it.opts.find(o => o.id === s.opt)) { s.opt = null; if (s.mode === "in") s.mode = null; } if (s.mode === null && it.def === "out") s.mode = "out"; if (s.mode === null && !it.opts && !it.def) s.mode = "in"; });
}

// ============================================================ UI
const $ = (sel) => document.querySelector(sel);
const view = $("#view"), stepsEl = $("#steps"), metaEl = $("#meta"), bar = $("#bar");
// Schritte: 0 = Projekt & Teilnehmer, 1..n = Betreffe, n+1 = Protokoll
const steps = () => { const secs = S.variant ? secsFor(S.variant) : []; return [{ id: "proj", name: "Projekt" }, ...secs, { id: "pdf", name: "Protokoll" }]; };

function draw() {
  const v = S.variant;
  const sts = steps(); const secs = sts.slice(1, -1);
  metaEl.innerHTML = v ? `<span class="chip">${VARIANTS[v].k} ${esc(VARIANTS[v].name)}</span>${S.proj.komNr ? `<span>Kom ${esc(S.proj.komNr)}</span>` : ""}` : "";
  stepsEl.innerHTML = "";
  if (!v || S.choose) { drawStart(); bar.hidden = true; return; }
  if (S.step >= sts.length) S.step = sts.length - 1;
  sts.forEach((sp, i) => {
    const b = document.createElement("button"); b.className = "step"; b.type = "button";
    if (S.step === i) b.setAttribute("aria-current", "step");
    if (sp.id === "proj") { const ok = S.proj.name && S.proj.komNr && S.teiln.length; b.innerHTML = `Projekt <span class="n ${ok ? "done" : "open"}">${ok ? "✓" : "offen"}</span>`; }
    else if (sp.id === "pdf") b.textContent = "Protokoll";
    else { const open = itemsFor(v, sp.id).filter(it => itemState(it) === "open").length; b.innerHTML = `${esc(sp.name)} <span class="n ${open ? "open" : "done"}">${open ? open + " offen" : "✓"}</span>`; }
    b.onclick = () => go(i); stepsEl.appendChild(b);
  });
  bar.hidden = false;
  const sp = sts[S.step];
  if (sp.id === "proj") drawProject();
  else if (sp.id === "pdf") drawFinal(secs);
  else drawSection(sp, S.step, secs.length);
  $("#btnPrev").textContent = S.step === 0 ? "Variante" : "Zurück";
  $("#btnNext").textContent = S.step === sts.length - 2 ? "Protokoll" : "Weiter";
  $("#btnNext").hidden = S.step >= sts.length - 1;
  const allOpen = itemsFor(v).filter(it => itemState(it) === "open").length;
  $("#barStatus").textContent = sp.id === "pdf" ? "" : `Schritt ${S.step + 1} von ${sts.length} · ${allOpen ? allOpen + " Punkte offen" : "alle Punkte entschieden"}`;
  if (storageFull) $("#barStatus").textContent = "Speicher voll – weniger/kleinere Fotos";
}
function go(i) { S.step = i; save(); draw(); window.scrollTo({ top: 0 }); }
function redraw() { const y = window.scrollY; draw(); window.scrollTo({ top: y }); }

  `;

  [1,2,3].forEach(n => {

// ------------------------------------------------ Betreff-Seiten
function fieldHtml(k, it) {
  const f = F[k]; const id = `f-${it.id}-${k}`; const val = S.fields[k] ?? (f.d ?? "");
  let ctrl;
  if (f.t === "select") ctrl = `<select id="${id}" data-k="${k}">${f.o.map(o => `<option ${o === (S.fields[k] ?? f.o[0]) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.t === "textarea") ctrl = `<textarea id="${id}" data-k="${k}" placeholder="${esc(f.hint || "")}">${esc(val)}</textarea>`;
  else ctrl = `<input id="${id}" data-k="${k}" type="${f.t || "text"}" ${f.t === "number" ? 'inputmode="decimal"' : ""} placeholder="${esc(f.hint || f.ph || "")}" value="${esc(String(val))}">`;
  return `<div class="field ${f.wide ? "wide" : ""}"><label for="${id}">${esc(f.l)}</label>${ctrl}</div>`;
}

function drawSection(sec, idx, n) {
  const v = S.variant; const its = itemsFor(v, sec.id);
  const intro = { org: "Was der Bauherr / die Verwaltung bereitstellt.", dem: "Rückbau, Mulde, Abdecken, Vorarbeiten im Schacht.", ele: "Steht teilweise auch im Dispoplan, geht aber gerne vergessen.", bau: "Wie Demonteur, ohne Demontage. Staubschleuse nicht vergessen.", sch: "Lastträger vor der Demontage, Aufmass, Blenden.", mal: "Ölanstrich Maschinenraum und Schachtgrube.", gip: "Zargen und alte Öffnungen.", hin: "Optional. Standardtexte, die du ans Ende des Protokolls stellen kannst." }[sec.id] || "";
  let h = `<h2>${idx}. Besprechungsnotiz – ${esc(sec.name)}</h2><p class="lead">${esc(intro)}</p><div class="items">`;
  its.forEach(it => {
    const s = st(it.id); const state = itemState(it);
    h += `<div class="item ${s.mode === "out" ? "out" : ""} ${state === "open" ? "open-state" : ""} ${it.star ? "star" : ""}" data-id="${it.id}">
      <div class="item-h"><div class="l">${esc(it.l)}${it.hint ? `<small>${esc(it.hint)}</small>` : ""}</div>
        <div class="seg"><button type="button" class="${s.mode === "in" ? "on-in" : ""}" data-mode="in">Aufnehmen</button><button type="button" class="${s.mode === "out" ? "on-out" : ""}" data-mode="out">Weglassen</button></div></div>`;
    if (it.opts) {
      h += `<div class="opts">` + it.opts.map(o => `<label class="opt ${s.opt === o.id ? "sel" : ""}"><input type="radio" name="opt-${it.id}" value="${o.id}" ${s.opt === o.id ? "checked" : ""}><span><span class="ol">${esc(o.l)}</span>${o.d ? `<br><span class="od">${esc(o.d)}</span>` : ""}</span></label>`).join("") + `</div>`;
    }
    const fkeys = it.opts ? ((it.opts.find(o => o.id === s.opt) || {}).f || []) : (it.f || []);
    if (fkeys.length) h += `<div class="fields">${fkeys.map(k => fieldHtml(k, it)).join("")}</div>`;
    const txt = itemText(it, true);
    if (txt) h += `<div class="preview">${txt}</div>`;
    h += `</div>`;
  });
  h += `</div>`;
  // Eigene Zeilen
  const cs = S.custom[sec.id] || [];
  h += `<div class="custom" style="margin-top:10px"><div class="eyebrow">Eigene Zeile für ${esc(sec.name)}</div>
    ${cs.length ? `<div class="customs">${cs.map((c, i) => `<div class="cline"><span>${esc(c)}</span><button type="button" class="btn small ghost" data-del="${i}">Löschen</button></div>`).join("")}</div>` : ""}
    <textarea id="customIn" placeholder="Kleine Ergänzung, die nur bei diesem Projekt gilt …"></textarea>
    <div><button type="button" class="btn small" id="customAdd">Zeile hinzufügen</button></div></div>`;
  // Fotos
  const ph = S.photos[sec.id] || [];
  h += `<div class="custom" style="margin-top:10px"><div class="eyebrow">Fotos zu ${esc(sec.name)}</div>
    <div class="thumbs">${ph.map((p, i) => `<div class="thumb"><img src="${p}" alt=""><button type="button" class="x" data-pdel="${i}" aria-label="Foto entfernen">×</button></div>`).join("")}</div>
    <label class="btn small" for="photoIn">+ Foto aufnehmen / wählen</label><input id="photoIn" type="file" accept="image/*" multiple hidden></div>`;
  view.innerHTML = h;

  // Events
  view.querySelectorAll(".item").forEach(card => {
    const it = ITEMS.find(x => x.id === card.dataset.id); const s = st(it.id);
    card.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { s.mode = b.dataset.mode; if (s.mode === "in" && it.opts && !s.opt && it.opts.length === 1) s.opt = it.opts[0].id; save(); redraw(); });
    card.querySelectorAll(`input[type=radio]`).forEach(r => r.onchange = () => { s.opt = r.value; s.mode = "in"; save(); redraw(); });
    card.querySelectorAll("[data-k]").forEach(inp => {
      const upd = () => { S.fields[inp.dataset.k] = inp.value; save(); const pv = card.querySelector(".preview"); if (pv) pv.innerHTML = itemText(it, true); syncField(inp.dataset.k, inp); };
      inp.oninput = upd; inp.onchange = upd;
    });
  });
  $("#customAdd").onclick = () => { const t = $("#customIn").value.trim(); if (!t) return; (S.custom[sec.id] = S.custom[sec.id] || []).push(t); save(); redraw(); };
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.custom[sec.id].splice(+b.dataset.del, 1); save(); redraw(); });
  view.querySelectorAll("[data-pdel]").forEach(b => b.onclick = () => { S.photos[sec.id].splice(+b.dataset.pdel, 1); save(); redraw(); });
  $("#photoIn").onchange = async (e) => {
    const files = [...e.target.files]; if (!files.length) return;
    for (const f of files) { try { const d = await shrink(f, 1100, 0.68); (S.photos[sec.id] = S.photos[sec.id] || []).push(d); } catch (err) {} }
    save(); redraw();
  };
}
function syncField(k, src) {
  view.querySelectorAll(`[data-k="${k}"]`).forEach(o => { if (o !== src) { o.value = src.value; const card = o.closest(".item"); const it = ITEMS.find(x => x.id === card.dataset.id); const pv = card.querySelector(".preview"); if (pv) pv.innerHTML = itemText(it, true); } });
}
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = rej; img.src = url;
  });
}

// ------------------------------------------------ Abschluss: Unterschrift, PDF, Texte
function outputBlocks(secs) {
  return secs.map(sec => {
    const lines = itemsFor(S.variant, sec.id).filter(it => itemState(it) === "in").map(it => itemText(it, false)).filter(Boolean);
    (S.custom[sec.id] || []).forEach(c => lines.push(c));
    return { sec, lines, photos: S.photos[sec.id] || [] };
  }).filter(b => b.lines.length || b.photos.length);
}
function drawFinal(secs) {
  const blocks = outputBlocks(secs);
  const open = itemsFor(S.variant).filter(it => itemState(it) === "open");
  const missing = blocks.reduce((n, b) => n + b.lines.filter(l => /\[[^\]]+\]/.test(l)).length, 0);
  const projMissing = ["name", "komNr"].filter(k => !S.proj[k]);
  let h = `<h2>Protokoll${S.proj.komNr ? ` · Kom ${esc(S.proj.komNr)}` : ""}</h2>
    <p class="lead">${VARIANTS[S.variant].k} ${esc(VARIANTS[S.variant].name)}${S.proj.name ? " · " + esc(S.proj.name) : ""}. Unterschreiben, PDF erstellen, teilen oder herunterladen.</p>`;
  if (projMissing.length) h += `<div class="notice warn">Projektname oder Kom Nr. fehlt noch (Schritt «Projekt»).</div>`;
  if (!S.teiln.length) h += `<div class="notice warn">Keine Teilnehmer erfasst.</div>`;
  if (open.length) h += `<div class="notice warn">${open.length} Punkt${open.length > 1 ? "e" : ""} noch nicht entschieden: ${open.map(it => esc(it.l)).join(", ")}. Diese fehlen im Protokoll.</div>`;
  if (missing) h += `<div class="notice warn">${missing} Zeile${missing > 1 ? "n" : ""} enthalten noch Platzhalter in [eckigen Klammern].</div>`;
  if (!open.length && !missing && !projMissing.length) h += `<div class="notice good">Alles vollständig.</div>`;
  h += `<div class="card"><div class="eyebrow">Unterschrift ${esc(S.proj.vonName || "Verfasser")}</div>
    <canvas id="sig" class="sig" width="800" height="240"></canvas>
    <div class="rowbtns" style="margin:8px 0 0"><button type="button" class="btn small" id="sigClear">Löschen</button><span class="hint">Wird gemerkt und beim nächsten Protokoll wiederverwendet.</span></div></div>`;
  h += `<div class="rowbtns"><button type="button" class="btn primary" id="pdfShare">PDF teilen / per Mail</button><button type="button" class="btn" id="pdfDown">PDF herunterladen</button><button type="button" class="btn ghost" id="btnNew">Neues Protokoll</button></div><div id="pdfMsg"></div><div id="confirmNew"></div>`;
  h += `<details class="texts"><summary>Textbausteine zum Kopieren (für MoreApp)</summary><div class="rowbtns" style="margin-top:10px"><button type="button" class="btn small" id="copyAll">Alles kopieren</button></div>`;
  blocks.forEach((b, bi) => {
    h += `<div class="out-sec"><div class="out-h"><div class="t">${bi + 1}. ${esc(b.sec.name)}<small>${b.lines.length} Zeile${b.lines.length === 1 ? "" : "n"}</small></div><button type="button" class="btn small" data-copysec="${b.sec.id}">Betreff kopieren</button></div><div class="lines">`;
    b.lines.forEach((l, i) => { h += `<div class="line"><span class="n">${i + 1}</span><span class="tx">${esc(l).replace(/\[[^\]]+\]/g, m => `<span class="ph">${m}</span>`)}</span><button type="button" class="btn small ghost cp" data-copy="${bi}:${i}">Kopieren</button></div>`; });
    h += `</div></div>`;
  });
  h += `</details>`;
  view.innerHTML = h;
  initSig();
  const secText = (b) => b.lines.join("\n");
  const allText = blocks.map((b, i) => `${i + 1}. ${b.sec.name}\n${secText(b)}`).join("\n\n");
  $("#copyAll").onclick = (e) => copy(allText, e.currentTarget);
  $("#btnNew").onclick = () => { $("#confirmNew").innerHTML = `<div class="notice warn confirm">Alle Eingaben löschen und neu beginnen? <button type="button" class="btn small" id="yesNew">Ja, löschen</button><button type="button" class="btn small ghost" id="noNew">Abbrechen</button></div>`; $("#yesNew").onclick = () => { S = blank(); save(); draw(); window.scrollTo({ top: 0 }); }; $("#noNew").onclick = () => $("#confirmNew").innerHTML = ""; };
  view.querySelectorAll("[data-copysec]").forEach(b => b.onclick = (e) => copy(secText(blocks.find(x => x.sec.id === b.dataset.copysec)), e.currentTarget));
  view.querySelectorAll("[data-copy]").forEach(b => b.onclick = (e) => { const [bi, i] = b.dataset.copy.split(":").map(Number); copy(blocks[bi].lines[i], e.currentTarget); });
  $("#pdfShare").onclick = () => exportPdf(blocks, "share");
  $("#pdfDown").onclick = () => exportPdf(blocks, "download");
}

// Unterschrift
function initSig() {
  const c = $("#sig"); const ctx = c.getContext("2d");
  const paint = () => { ctx.clearRect(0, 0, c.width, c.height); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); if (S.sign) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, c.width, c.height); im.src = S.sign; } };
  paint();
  ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  let drawing = false;
  const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = (e) => { drawing = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); e.preventDefault(); };
  c.onpointermove = (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); e.preventDefault(); };
  const end = () => { if (!drawing) return; drawing = false; S.sign = c.toDataURL("image/png"); save(); };
  c.onpointerup = end; c.onpointercancel = end; c.onpointerleave = end;
  $("#sigClear").onclick = () => { S.sign = ""; save(); paint(); };
}

function buildPdf(blocks) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const p = S.proj; const L = 13, R = 197, W = R - L; let y = 0; let page = 1;
  const grey = [217, 217, 217];
  const title = `Besprechungsprotokoll von dem Projekt: ${p.name || ""}`;
  const footerLeft = `Besprechungsprotokoll Projekt: ${p.name || ""}`;
  const header = () => {
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(0); doc.text("AS Aufzüge AG", L, 18);
    doc.setFont("helvetica", "normal"); doc.text(p.gs || "AS-OS", L, 23);
    doc.addImage(LOGO, "JPEG", R - 45, 11, 45, 12.4);
    y = 31;
  };
  const footer = () => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(0);
    doc.text(footerLeft, L, 287);
    doc.text(`Seite ${page} von {tot}`, R, 287, { align: "right" });
  };
  const newPage = () => { footer(); doc.addPage(); page++; header(); };
  const need = (h) => { if (y + h > 278) newPage(); };
  const bar = (text) => { need(12); doc.setFillColor(...grey); doc.rect(L, y, W, 6, "F"); doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.text(text, L + 2.5, y + 4.2); y += 9; };
  const kv = (x, k, v, yy) => { doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.text(k, x + 2.5, yy); doc.text(String(v || ""), x + 32, yy); };
  const para = (label, text, indent) => {
    doc.setFontSize(9); doc.setFont("helvetica", "normal");
    const lines = doc.splitTextToSize(text, W - indent - 2.5);
    need(lines.length * 4.3 + 2);
    doc.setFontSize(9); doc.setFont("helvetica", "normal");
    doc.text(label, L + 2.5, y);
    doc.text(lines, L + indent, y);
    y += lines.length * 4.3 + 2.4;
  };

  header();
  doc.setFont("helvetica", "normal"); doc.setFontSize(15); doc.text(title, L, y + 4); y += 11;

  // Projektdetails / Erstellung
  const colW = (W - 5) / 2; const x2 = L + colW + 5;
  doc.setFillColor(...grey); doc.rect(L, y, colW, 6, "F"); doc.rect(x2, y, colW, 6, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.text("Projektdetails", L + 2.5, y + 4.2); doc.text("Erstellung", x2 + 2.5, y + 4.2);
  let yy = y + 11;
  kv(L, "Kom. Nr.", p.komNr, yy); kv(L, "Typ", p.typ, yy + 4.2); kv(L, "Standortadresse", p.strasse, yy + 8.4); kv(L, "", p.plzOrt, yy + 12.6);
  kv(x2, "Von", p.vonName, yy); kv(x2, "", p.vonPos, yy + 4.2); kv(x2, "Datum", fmtDate(p.datum, "-"), yy + 8.4); kv(x2, "Ort", p.ort, yy + 12.6);
  y = yy + 18;

  // Teilnehmer
  bar("Teilnehmer");
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text("Die aufgeführten Personen haben an der Baubesprechung teilgenommen:", L + 2.5, y); y += 6;
  S.teiln.forEach(t => {
    need(5); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    const right = [t.name, t.tel, t.mail].filter(Boolean).join(" | ");
    doc.text((t.fn || "Teilnehmer") + ":", L + 6, y); doc.text(right, L + 56, y); y += 4.3;
  });
  y += 3;

  // Besprechungsnotizen
  blocks.forEach((b, i) => {
    bar(`${i + 1}.  Besprechungsnotiz`);
    doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text("Betreff:", L + 2.5, y); doc.setFont("helvetica", "normal"); doc.text(b.sec.name, L + 16, y); y += 6;
    b.lines.forEach(l => para("Beschreibung:", l, 25));
    if (b.photos.length) {
      const pw = (W - 4) / 3, phh = 42;
      b.photos.forEach((src, k) => {
        if (k % 3 === 0) { need(phh + 3); }
        const dims = imgDims(src); const sc = Math.min(pw / dims.w, phh / dims.h); const w = dims.w * sc, h = dims.h * sc;
        const x = L + (k % 3) * (pw + 2);
        try { doc.addImage(src, "JPEG", x, y, w, h); } catch (e) {}
        if (k % 3 === 2 || k === b.photos.length - 1) y += phh + 3;
      });
    }
    y += 2;
  });

  // Unterschriften (neue Seite wie im Original)
  newPage();
  bar("Unterschriften");
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text("Ohne schriftlichen Gegenbericht innerhalb 5 Arbeitstage gilt das Protokoll als freigegeben und genehmigt.", L + 2.5, y); y += 8;
  doc.text(`Ort / Datum: ${p.ort || ""}, ${fmtDate(p.datum, "-")}`, L + 2.5, y); y += 6;
  doc.text("AS Aufzüge AG", L + 2.5, y); y += 8;
  if (S.sign) { try { doc.addImage(S.sign, "PNG", L + 2.5, y, 50, 15); } catch (e) {} }
  y += 24;
  doc.text(p.vonName || "", L + 2.5, y); doc.text(p.vonPos || "", L + 2.5, y + 4.2);
  footer();
  if (typeof doc.putTotalPages === "function") doc.putTotalPages("{tot}");

}
const dimCache = {};
function imgDims(src) { if (dimCache[src]) return dimCache[src]; const im = new Image(); im.src = src; return dimCache[src] = { w: im.naturalWidth || 4, h: im.naturalHeight || 3 }; }
function preloadDims(blocks) { return Promise.all(blocks.flatMap(b => b.photos).map(src => new Promise(res => { const im = new Image(); im.onload = () => { dimCache[src] = { w: im.naturalWidth, h: im.naturalHeight }; res(); }; im.onerror = res; im.src = src; }))); }
async function exportPdf(blocks, mode) {
  const msg = $("#pdfMsg"); msg.innerHTML = `<div class="notice good">PDF wird erstellt …</div>`;
  try {
    if (!window.jspdf) throw new Error("PDF-Bibliothek nicht geladen (kein Internet?).");
    await preloadDims(blocks);
    const doc = buildPdf(blocks);
    const safe = (s) => String(s || "").replace(/[^\wäöüÄÖÜ-]+/g, "_").replace(/^_+|_+$/g, "");
    const name = `Besprechungsprotokoll_Projekt_${safe(S.proj.name) || "Bausitzung"}_${safe(S.proj.komNr)}.pdf`;
    const blob = doc.output("blob");
    const file = new File([blob], name, { type: "application/pdf" });
    if (mode === "share" && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      msg.innerHTML = `<div class="notice good">PDF übergeben.</div>`; return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    msg.innerHTML = `<div class="notice good">PDF «${esc(name)}» ${mode === "share" ? "wurde heruntergeladen (Teilen wird von diesem Browser nicht unterstützt)" : "heruntergeladen"}.</div>`;
  } catch (e) {
    if (e && e.name === "AbortError") { msg.innerHTML = ""; return; }
    msg.innerHTML = `<div class="notice warn">PDF konnte nicht erstellt werden: ${esc(e.message || e)}</div>`;
  }
}

function copy(text, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = "Kopiert"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1400); };
  const fb = () => { const ta = $("#fallback"); ta.value = text; ta.style.left = "0"; ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.style.left = "-9999px"; if (ok) done(); else { btn.textContent = "Text markieren"; } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb); else fb();
}

$("#btnPrev").onclick = () => { if (S.step === 0) { S.choose = true; save(); draw(); window.scrollTo({ top: 0 }); } else go(S.step - 1); };
$("#btnNext").onclick = () => go(S.step + 1);

if (S.variant) applyDefaults(S.variant);
draw();
</script>
