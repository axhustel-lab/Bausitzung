<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#C8102E"><style>[hidden]{display:none!important}</style></head><body>
<title>Bausitzung Baukasten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F2F3F5; --surface: #FFFFFF; --surface-2: #F7F8FA; --ink: #1A1D21; --muted: #5E6673;
    --line: #D9DDE3; --line-strong: #B9C0C9; --accent: #C8102E; --accent-ink: #FFFFFF; --accent-soft: #FBE9EC;
    --good: #1E7F4F; --good-soft: #E3F3EA; --warn: #9A6400; --warn-soft: #FFF3D6; --focus: #2F6FED;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 10px; --shadow: 0 1px 2px rgba(20,24,30,.06), 0 4px 14px rgba(20,24,30,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #141619; --surface: #1E2126; --surface-2: #262A30; --ink: #ECEEF1; --muted: #9AA3AE;
      --line: #2F343B; --line-strong: #454C55; --accent: #E5495F; --accent-ink: #FFFFFF; --accent-soft: #3B1C23;
      --good: #4CC48A; --good-soft: #1A3527; --warn: #E2B25A; --warn-soft: #3A2E12; --focus: #6C9BFF;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #141619; --surface: #1E2126; --surface-2: #262A30; --ink: #ECEEF1; --muted: #9AA3AE;
    --line: #2F343B; --line-strong: #454C55; --accent: #E5495F; --accent-ink: #FFFFFF; --accent-soft: #3B1C23;
    --good: #4CC48A; --good-soft: #1A3527; --warn: #E2B25A; --warn-soft: #3A2E12; --focus: #6C9BFF;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 110px; }

  /* Header */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 720px; margin: 0 auto; padding: 10px 16px 0; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .brand h1 .mark { width: 10px; height: 10px; background: var(--accent); clip-path: polygon(50% 0, 100% 100%, 0 100%); display: inline-block; }
  .brand .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .steps { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .steps::-webkit-scrollbar { display: none; }
  .step { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .step[aria-current="step"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .step .n { font-size: 11px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
  .step .n.open { background: var(--warn-soft); color: var(--warn); }
  .step .n.done { background: var(--good-soft); color: var(--good); }

  /* Sections */
  h2 { font-size: 20px; margin: 22px 0 4px; letter-spacing: -.01em; text-wrap: balance; }
  .lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; max-width: 60ch; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

  /* Variant cards */
  .variants { display: grid; gap: 10px; margin-top: 12px; }
  .vcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; box-shadow: var(--shadow); }
  .vcard:hover { border-color: var(--line-strong); }
  .vcard .t { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .vcard .k { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 500; }
  .vcard .d { color: var(--muted); font-size: 13.5px; }
  .project { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  @media (max-width: 460px) { .project { grid-template-columns: 1fr; } }

  /* Item cards */
  .items { display: grid; gap: 10px; }
  .item { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
  .item.out { background: var(--surface-2); border-style: dashed; }
  .item.out .fields, .item.out .preview, .item.out .opts { display: none; }
  .item.open-state { border-left: 3px solid var(--warn); }
  .item.star { border-color: var(--accent); }
  .item-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .item-h .l { font-weight: 600; font-size: 14.5px; }
  .item-h .l small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .item.star .l::before { content: "Nie vergessen"; display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; margin-right: 8px; vertical-align: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex: 0 0 auto; }
  .seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.on-in { background: var(--good-soft); color: var(--good); font-weight: 600; }
  .seg button.on-out { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .opts { display: grid; gap: 6px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
  .opt.sel { border-color: var(--ink); background: var(--surface-2); }
  .opt input { margin-top: 3px; accent-color: var(--accent); }
  .opt .ol { font-weight: 600; font-size: 13.5px; }
  .opt .od { font-size: 12.5px; color: var(--muted); }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 10px; }
  .field { display: grid; gap: 3px; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .field input, .field select, .field textarea, .pfield input { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink); font-size: 14px; }
  .field textarea { min-height: 56px; resize: vertical; }
  .preview { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; color: var(--ink); background: var(--surface-2); border-radius: 7px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
  .preview .ph { color: var(--accent); font-weight: 500; }
  .custom { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
  .custom textarea { width: 100%; min-height: 48px; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); resize: vertical; }
  .customs { display: grid; gap: 6px; }
  .cline { display: flex; gap: 8px; align-items: flex-start; font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 6px 10px; border-radius: 7px; }
  .cline span { flex: 1; white-space: pre-wrap; }


  /* Projekt, Teilnehmer, Fotos, Unterschrift */
  .card { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; margin-bottom: 10px; }
  .teiln { display: grid; gap: 8px; margin-bottom: 10px; }
  .trow { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-items: end; }
  .trow .btn { justify-self: start; }
  @media (max-width: 460px) { .trow { grid-template-columns: 1fr; } }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb { position: relative; width: 96px; height: 72px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 11px; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 22px; cursor: pointer; padding: 0; }
  .sig { width: 100%; max-width: 100%; aspect-ratio: 10 / 3; border: 1px dashed var(--line-strong); border-radius: 8px; background: #fff; touch-action: none; display: block; }
  .hint { font-size: 12.5px; color: var(--muted); align-self: center; }
  .doors { display: grid; gap: 8px; }
  .door { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
  details.texts { margin-top: 18px; }
  .gate { max-width: 420px; margin: 48px auto 0; display: grid; gap: 14px; }
  .gate .card { gap: 12px; }
  .gate h2 { margin: 0; }
  .gate input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font-size: 16px; }
  .gate label.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted); }
  .arch { display: grid; gap: 8px; margin-top: 10px; }
  .arow { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 6px; }
  .arow .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .arow .m { font-size: 12.5px; color: var(--muted); }
  .arow .b { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
  .tag.fertig { background: var(--good-soft); color: var(--good); }
  .tag.vorlage { background: var(--accent-soft); color: var(--accent); }
  .plist { display: grid; gap: 8px; }
  .prow { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .prow .n { font-weight: 600; } .prow .n small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .picker { border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 8px; display: grid; gap: 6px; grid-column: 1 / -1; }
  .picker input[type=search] { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); }
  .pick { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 7px 10px; cursor: pointer; font-size: 13.5px; }
  .pick:hover { border-color: var(--ink); }
  .pick small { color: var(--muted); display: block; font-size: 12px; }
  .crow { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-items: end; }
  @media (max-width: 460px) { .crow { grid-template-columns: 1fr; } }
  .crow .b { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  details.texts summary { cursor: pointer; font-weight: 600; padding: 8px 0; color: var(--muted); }

  /* Buttons */
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.small { padding: 4px 10px; font-size: 12.5px; font-weight: 500; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.copied { background: var(--good-soft); border-color: var(--good); color: var(--good); }

  /* Bottom bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .bar .status { font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Output */
  .out-sec { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .out-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .out-h .t { font-weight: 600; }
  .out-h .t small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12.5px; }
  .lines { display: grid; }
  .line { display: flex; gap: 10px; align-items: flex-start; padding: 8px 14px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .line:last-child { border-bottom: 0; }
  .line .n { color: var(--muted); flex: 0 0 20px; font-variant-numeric: tabular-nums; }
  .line .tx { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .line .ph { color: var(--accent); font-weight: 500; }
  .line .cp { flex: 0 0 auto; }
  .notice { border-radius: var(--radius); padding: 10px 14px; font-size: 13.5px; margin-bottom: 12px; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.good { background: var(--good-soft); color: var(--good); }
  .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  .fallback { position: fixed; left: -9999px; top: 0; }
  .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
</style>

const isMobileNr = (t) => /^07[5-9]/.test(String(t || "").replace(/[\s\-().]/g, "").replace(/^\+41/, "0").replace(/^0041/, "0"));
function pickMobile(tels) { const list = tels.map(t => ({ n: t.n.trim(), cell: !!t.cell })).filter(t => t.n); return (list.find(t => isMobileNr(t.n)) || list.find(t => t.cell) || list[0] || { n: "" }).n; }
function parseVcf(text) {
  const out = []; const lines = text.replace(/\r\n?/g, "\n").split("\n");
  const unf = []; for (const l of lines) { if ((l.startsWith(" ") || l.startsWith("\t")) && unf.length) unf[unf.length - 1] += l.slice(1); else unf.push(l); }
  let c = null;
  const dec = (v, params) => { let s = v; if (/ENCODING=QUOTED-PRINTABLE/i.test(params)) { try { s = decodeURIComponent(s.replace(/=\n/g, "").replace(/=([0-9A-F]{2})/gi, "%$1")); } catch (e) {} } return s.replace(/\\,/g, ",").replace(/\\;/g, ";").replace(/\\n/gi, " ").trim(); };
  for (const l of unf) {
    if (/^BEGIN:VCARD/i.test(l)) { c = { fn: "", n: "", tels: [], mail: "", org: "" }; continue; }
    if (/^END:VCARD/i.test(l)) { if (c) { const name = c.fn || c.n; if (name) out.push({ name, tel: pickMobile(c.tels), mail: c.mail, firma: c.org }); } c = null; continue; }
    if (!c) continue;
    const m = /^([^:;]+)((?:;[^:]*)?):(.*)$/.exec(l); if (!m) continue;
    const key = m[1].toUpperCase().replace(/^ITEM\d+\./, ""), params = m[2] || "", val = m[3];
    if (key === "FN") c.fn = dec(val, params);
    else if (key === "N") { const parts = dec(val, params).split(";"); c.n = [parts[1], parts[0]].filter(Boolean).join(" "); }
    else if (key === "TEL") c.tels.push({ n: dec(val, params).replace(/^tel:/i, ""), cell: /CELL|MOBILE|IPHONE/i.test(params) });
    else if (key === "EMAIL" && !c.mail) c.mail = dec(val, params);
    else if (key === "ORG") c.org = dec(val, params).split(";")[0];
  }
  return out;
}

  if (!(navigator.contacts && navigator.contacts.select)) return null;
  try { const res = await navigator.contacts.select(["name", "tel", "email"], { multiple: true }); return res.map(r => ({ name: (r.name || [])[0] || "", tel: pickMobile((r.tel || []).map(t => ({ n: t }))), mail: (r.email || [])[0] || "", firma: "" })); } catch (e) { return []; }
}

function fieldHtml(k, it) {
  const f = F[k]; const id = `f-${it.id}-${k}`; const val = S.fields[k] ?? (f.d ?? "");

  if (f.t === "select") ctrl = `<select id="${id}" data-k="${k}">${f.o.map(o => `<option value="${esc(o)}" ${o === (S.fields[k] ?? f.o[0]) ? "selected" : ""}>${o === "" ? "– keine –" : esc(o)}</option>`).join("")}</select>`;
  else if (f.t === "textarea") ctrl = `<textarea id="${id}" data-k="${k}" placeholder="${esc(f.hint || "")}">${esc(val)}</textarea>`;
  else ctrl = `<input id="${id}" data-k="${k}" type="${f.t || "text"}" ${f.t === "number" ? 'inputmode="decimal"' : ""} placeholder="${esc(f.hint || f.ph || "")}" value="${esc(String(val))}">`;
  return `<div class="field ${f.wide ? "wide" : ""}"><label for="${id}">${esc(f.l)}</label>${ctrl}</div>`;
}

function syncField(k, src) {
  view.querySelectorAll(`[data-k="${k}"]`).forEach(o => { if (o !== src) { o.value = src.value; const card = o.closest(".item"); const it = ITEMS.find(x => x.id === card.dataset.id); const pv = card.querySelector(".preview"); if (pv) pv.innerHTML = itemText(it, true); } });
}
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = rej; img.src = url;
  });
}

function outputBlocks(secs) {
  return secs.map(sec => {
    const lines = itemsFor(S.variant, sec.id).filter(it => itemState(it) === "in").flatMap(it => itemLines(it));
    (S.custom[sec.id] || []).forEach(c => lines.push(c));
    return { sec, lines, photos: S.photos[sec.id] || [] };
  }).filter(b => b.lines.length || b.photos.length);
}
function drawFinal(secs) {
  const blocks = outputBlocks(secs);
  const open = itemsFor(S.variant).filter(it => itemState(it) === "open");
  const missing = blocks.reduce((n, b) => n + b.lines.filter(l => /\[[^\]]+\]/.test(l)).length, 0);
  const projMissing = ["name", "komNr"].filter(k => !S.proj[k]);
  let h = `<h2>Protokoll${S.proj.komNr ? ` · Kom ${esc(S.proj.komNr)}` : ""}</h2>
    <p class="lead">${VARIANTS[S.variant].k} ${esc(VARIANTS[S.variant].name)}${S.proj.name ? " · " + esc(S.proj.name) : ""}. Unterschreiben, PDF erstellen, teilen oder herunterladen.</p>`;
  if (projMissing.length) h += `<div class="notice warn">Projektname oder Kom Nr. fehlt noch (Schritt «Projekt»).</div>`;
  if (!S.teiln.length) h += `<div class="notice warn">Keine Teilnehmer erfasst.</div>`;
  if (open.length) h += `<div class="notice warn">${open.length} Punkt${open.length > 1 ? "e" : ""} noch nicht entschieden: ${open.map(it => esc(it.l)).join(", ")}. Diese fehlen im Protokoll.</div>`;
  if (missing) h += `<div class="notice warn">${missing} Zeile${missing > 1 ? "n" : ""} enthalten noch Platzhalter in [eckigen Klammern].</div>`;
  if (!open.length && !missing && !projMissing.length) h += `<div class="notice good">Alles vollständig.</div>`;
  h += `<div class="card"><div class="eyebrow">Unterschrift ${esc(S.proj.vonName || "Verfasser")}</div>
    <canvas id="sig" class="sig" width="800" height="240"></canvas>
    <div class="rowbtns" style="margin:8px 0 0"><button type="button" class="btn small" id="sigClear">Löschen</button><span class="hint">Gehört zu deinem Profil und wird beim nächsten Protokoll wiederverwendet.</span></div></div>`;
  const att = attachmentsFor(); if (att.length) h += `<div class="notice good">Beilage${att.length > 1 ? "n" : ""} wird mitgeschickt: ${att.map(f => esc(f.name)).join(", ")}</div>`;
  h += `<div class="card"><div class="eyebrow">Archiv auf diesem Gerät</div><div class="rowbtns" style="margin:0"><button type="button" class="btn" id="archSave">${S.archiveId ? "Protokoll im Archiv aktualisieren" : "Protokoll speichern"}</button><button type="button" class="btn" id="archTpl">Als Vorlage speichern</button></div><div id="archMsg"></div></div>`;
  h += `<div class="rowbtns"><button type="button" class="btn primary" id="pdfShare">PDF teilen / per Mail</button><button type="button" class="btn" id="pdfDown">PDF herunterladen</button><button type="button" class="btn ghost" id="btnNew">Neues Protokoll</button></div><div id="pdfMsg"></div><div id="confirmNew"></div>`;
  h += `<details class="texts"><summary>Textbausteine zum Kopieren (für MoreApp)</summary><div class="rowbtns" style="margin-top:10px"><button type="button" class="btn small" id="copyAll">Alles kopieren</button></div>`;
  blocks.forEach((b, bi) => {
    h += `<div class="out-sec"><div class="out-h"><div class="t">${bi + 1}. ${esc(b.sec.name)}<small>${b.lines.length} Zeile${b.lines.length === 1 ? "" : "n"}</small></div><button type="button" class="btn small" data-copysec="${b.sec.id}">Betreff kopieren</button></div><div class="lines">`;
    b.lines.forEach((l, i) => { h += `<div class="line"><span class="n">${i + 1}</span><span class="tx">${esc(l).replace(/\[[^\]]+\]/g, m => `<span class="ph">${m}</span>`)}</span><button type="button" class="btn small ghost cp" data-copy="${bi}:${i}">Kopieren</button></div>`; });
    h += `</div></div>`;
  });
  h += `</details>`;
  view.innerHTML = h;
  initSig();
  const secText = (b) => b.lines.join("\n");
  const allText = blocks.map((b, i) => `${i + 1}. ${b.sec.name}\n${secText(b)}`).join("\n\n");
  $("#copyAll").onclick = (e) => copy(allText, e.currentTarget);
  $("#btnNew").onclick = () => { $("#confirmNew").innerHTML = `<div class="notice warn confirm">Alle Eingaben löschen und neu beginnen? <button type="button" class="btn small" id="yesNew">Ja, löschen</button><button type="button" class="btn small ghost" id="noNew">Abbrechen</button></div>`; $("#yesNew").onclick = () => { S = blank(); save(); draw(); window.scrollTo({ top: 0 }); }; $("#noNew").onclick = () => $("#confirmNew").innerHTML = ""; };
  view.querySelectorAll("[data-copysec]").forEach(b => b.onclick = (e) => copy(secText(blocks.find(x => x.sec.id === b.dataset.copysec)), e.currentTarget));
  view.querySelectorAll("[data-copy]").forEach(b => b.onclick = (e) => { const [bi, i] = b.dataset.copy.split(":").map(Number); copy(blocks[bi].lines[i], e.currentTarget); });
  $("#archSave").onclick = async (e) => { const btn = e.currentTarget; try { await archiveCurrent("fertig"); $("#archMsg").innerHTML = `<div class="notice good" style="margin:10px 0 0">Protokoll gespeichert. Du findest es auf der Startseite unter «Archiv».</div>`; btn.textContent = "Protokoll im Archiv aktualisieren"; } catch (err) { $("#archMsg").innerHTML = `<div class="notice warn" style="margin:10px 0 0">Speichern fehlgeschlagen: ${esc(err.message || err)}</div>`; } };
  $("#archTpl").onclick = async () => { try { await archiveCurrent("vorlage"); $("#archMsg").innerHTML = `<div class="notice good" style="margin:10px 0 0">Vorlage gespeichert (ohne Projektdaten, Teilnehmer und Fotos).</div>`; } catch (err) { $("#archMsg").innerHTML = `<div class="notice warn" style="margin:10px 0 0">Speichern fehlgeschlagen: ${esc(err.message || err)}</div>`; } };
  $("#pdfShare").onclick = () => exportPdf(blocks, "share");
  $("#pdfDown").onclick = () => exportPdf(blocks, "download");
}

// Unterschrift
function initSig() {
  const c = $("#sig"); const ctx = c.getContext("2d");
  const paint = () => { ctx.clearRect(0, 0, c.width, c.height); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); if (S.sign) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, c.width, c.height); im.src = S.sign; } };
  paint();
  ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  let drawing = false;
  const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = (e) => { drawing = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); e.preventDefault(); };
  c.onpointermove = (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); e.preventDefault(); };
  const end = () => { if (!drawing) return; drawing = false; S.sign = c.toDataURL("image/png"); save(); };
  c.onpointerup = end; c.onpointercancel = end; c.onpointerleave = end;
  $("#sigClear").onclick = () => { S.sign = ""; save(); paint(); };
}

    const extra = files.length > 1 ? ` + ${files.length - 1} Beilage${files.length > 2 ? "n" : ""} (${files.slice(1).map(f => f.name).join(", ")})` : "";
    if (mode === "share" && navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: name });
      msg.innerHTML = `<div class="notice good">PDF übergeben${esc(extra)}.</div>`; return;
    }
    for (const [i, f] of files.entries()) {
      await new Promise(r => setTimeout(r, i ? 700 : 0));
      const url = URL.createObjectURL(f);
      const a = document.createElement("a"); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    msg.innerHTML = `<div class="notice good">PDF «${esc(name)}»${esc(extra)} ${mode === "share" ? "wurde heruntergeladen (Teilen wird von diesem Browser nicht unterstützt)" : "heruntergeladen"}.</div>`;
  } catch (e) {
    if (e && e.name === "AbortError") { msg.innerHTML = ""; return; }
    msg.innerHTML = `<div class="notice warn">PDF konnte nicht erstellt werden: ${esc(e.message || e)}</div>`;
  }
}

function copy(text, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = "Kopiert"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1400); };
  const fb = () => { const ta = $("#fallback"); ta.value = text; ta.style.left = "0"; ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.style.left = "-9999px"; if (ok) done(); else { btn.textContent = "Text markieren"; } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb); else fb();
}

$("#btnPrev").onclick = () => { if (S.step === 0) { S.choose = true; save(); draw(); window.scrollTo({ top: 0 }); } else go(S.step - 1); };
$("#btnNext").onclick = () => go(S.step + 1);

(() => { let pid = null; try { pid = localStorage.getItem(CUR_KEY) || sessionStorage.getItem(CUR_KEY); } catch (e) {} const p = PROFILES.find(x => x.id === pid); if (p && authed) { CUR = p; loadState(p.id); } })();
draw();
</script>
