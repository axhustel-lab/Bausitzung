  .notice { border-radius: var(--radius); padding: 10px 14px; font-size: 13.5px; margin-bottom: 12px; }

  .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  .fallback { position: fixed; left: -9999px; top: 0; }
  .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
</style>

  { id: "rahmen", s: "sch", v: [2], l: "Maschinenrahmen / Unterbau", def: "out", tpl: "Maschinenrahmen/Unterbau für neuen Antrieb gemäss Plan AS liefern und montieren bis {rahmenBis}.", f: ["rahmenBis"] },
  { id: "schloss", s: "sch", v: [2,3], l: "MR-Türe Schloss ersetzen", def: "out", tpl: "Maschinenraumtüre: Schloss normkonform ersetzen (abschliessbar, von innen ohne Schlüssel zu öffnen) bis {schlossBis}.", f: ["schlossBis"] },
  { id: "zugmr", s: "sch", v: [2,3], l: "Leiter / Absturzsicherung MR", def: "out", tpl: "Zugang Maschinenraum: {zugangArt} bis {zugangBis}.", f: ["zugangArt","zugangBis"] },
  { id: "kopf", s: "sch", v: [3], l: "Zylinder Kopfführung", def: "out", tpl: "Zylinderersatz: Kopfführung/Zylinderhalterung gemäss Plan AS liefern und montieren bis {kopfBis}.", f: ["kopfBis"], hint: "Nur bei Zylinderersatz" },

  // ---------------- Maler
  { id: "oelmr", s: "mal", v: [1,2,3], l: "Ölanstrich MR", tpl: "Ölanstrich Maschinenraum: Boden Maschinenraum mit ölfestem, staubbindendem Anstrich versehen bis {oelMrBis}.", f: ["oelMrBis"], hint: "Bei V1 weglassen, falls kein MR mehr" },
  { id: "oelgr", s: "mal", v: [1,2,3], l: "Ölanstrich Schachtgrube", tpl: "Ölanstrich Schachtgrube: Boden und Wände der Schachtgrube bis Höhe {grubeH} cm mit Ölanstrich versehen, nach Baumeisterarbeiten und vor Montagebeginn bis {oelGrBis}.", f: ["grubeH","oelGrBis"] },
  { id: "mrw", s: "mal", v: [2,3], l: "MR-Wände streichen", def: "out", tpl: "Maschinenraum: Wände und Decke streichen bis {mrWBis}.", f: ["mrWBis"] },
  { id: "vp1", s: "mal", v: [1], l: "Vorplätze streichen", tpl: "Vorplätze: Wände um die neuen Schachttüren nach Gipserarbeiten streichen, Farbe {vpFarbe}, ab {vpAb}.", f: ["vpFarbe","vpAb"] },
  { id: "vp2", s: "mal", v: [2,3], l: "Vorplätze bei Tableaus", tpl: "Vorplätze: Wände im Bereich der neuen Tableaus/Drücker nach Gipserarbeiten ausbessern/streichen, Farbe {vpFarbe}.", f: ["vpFarbe"] },

  // ---------------- Gipser
  { id: "gz", s: "gip", v: [1], l: "Zargen einputzen", tpl: "Neue Schachttürzargen einputzen/verputzen (Anschluss Zarge–Wand) nach Türmontage ab ca. {tuerAb}.", f: ["tuerAb"] },
  { id: "gboden", s: "gip", v: [1], l: "Bodenanschluss Schachttüren auffüllen", tpl: "Nach Türmontage ab ca. {tuerAb}: Bodenanschluss bei den Schachttüren auf Vorplatzniveau mit Mörtel auffüllen.", f: ["tuerAb"], hint: "Baumeister oder Gipser – einen von beiden aufnehmen" },
  { id: "gvp", s: "gip", v: [1], l: "Ausbrüche Vorplatz verputzen", tpl: "Ausbrüche und Dübellöcher im Vorplatzbereich verputzen." },
  { id: "gtab", s: "gip", v: [2,3], l: "Alte Tableau-Löcher verputzen", tpl: "Öffnungen der alten Tableaus/Drücker in den Vorplatzwänden verputzen; Ausschnitte für neue Tableaus gemäss Vorgabe AS erstellen." },
  { id: "gmr", s: "gip", v: [2,3], l: "MR ausbessern", tpl: "Maschinenraum: Wände und Decke nach Rückbau ausbessern.", hint: "Bei V1 weglassen, falls kein MR mehr" },
  { id: "gbs", s: "gip", v: [2,3], l: "Brandschutz Durchführungen", tpl: "Kabel- und Leitungsdurchführungen brandschutzkonform abschotten (falls durch Gipser)." },

  // ---------------- Hinweise
  { id: "h1", s: "hin", v: [1,2,3], l: "Bauseitige Leistungen – Bauherr oder AS als GU", opts: [
    { id: "bh", l: "Durch Bauherr", d: "Nicht im AS-Angebot enthalten", tpl: "Bauseitige Leistungen (Baumeister, Elektriker, Schlosser, Maler, Gipser) sind nicht im Angebot von AS Aufzüge AG enthalten und werden durch den Bauherrn direkt beauftragt und bezahlt." },
    { id: "gu", l: "AS ist Generalunternehmer", d: "Kosten im AS-Angebot inbegriffen", tpl: "AS Aufzüge AG ist Generalunternehmer: Die bauseitigen Leistungen (Baumeister, Elektriker, Schlosser, Maler, Gipser) sind im Angebot von AS Aufzüge AG enthalten und werden durch AS koordiniert und beauftragt." },
  ]},
  { id: "h2", s: "hin", v: [1,2,3], l: "Termine gemäss Bauprogramm", tpl: "Termine gemäss separatem Bauprogramm/Dispoplan. Bauseitige Vorarbeiten müssen bis zum jeweils genannten Datum abgeschlossen sein, sonst verschiebt sich der Montagebeginn." },
  { id: "h3", s: "hin", v: [1,2,3], l: "Zusatzleistungen nur schriftlich", tpl: "Zusatzleistungen von AS Aufzüge AG werden nur nach schriftlicher Bestätigung ausgeführt und separat verrechnet." },
];

// ============================================================ Zustand
const KEY = "bausitzung-baukasten-v1";
const KEEP_KEY = "bausitzung-baukasten-keep";
let KEEP = {}; try { KEEP = JSON.parse(localStorage.getItem(KEEP_KEY) || "{}"); } catch (e) {}
const blank = () => ({ variant: null, choose: true, komNr: "", projekt: "", step: 0, items: {}, fields: Object.assign({}, KEEP), custom: {} });
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); Object.keys(F).filter(k => F[k].keep).forEach(k => { if (S.fields[k]) KEEP[k] = S.fields[k]; }); localStorage.setItem(KEEP_KEY, JSON.stringify(KEEP)); } catch (e) {} }

const itemsFor = (v, sec) => ITEMS.filter(i => i.v.includes(v) && (!sec || i.s === sec));
const secsFor = (v) => SECTIONS.filter(s => itemsFor(v, s.id).length);
const st = (id) => S.items[id] || (S.items[id] = { mode: null, opt: null });

function fmtDate(v) { if (!v) return ""; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? `${m[3]}.${m[2]}.${m[1]}` : v; }
function fieldVal(k) {
  const f = F[k]; let v = S.fields[k];
  if (v === undefined || v === "") v = f.d !== undefined ? f.d : (f.t === "select" ? f.o[0] : "");
  if (f.t === "date") v = fmtDate(v);
  return v;
}
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Text rendern; html=true markiert leere Platzhalter
function render(tpl, fields, html) {
  return tpl.replace(/\{(_?\w+)\}/g, (m, k) => {
    if (k === "_demPartner") return S.variant === 1 ? "Demonteur" : "Monteur";
    const f = F[k]; if (!f) return m;
    const v = fieldVal(k);
    if (f.opt) { const pre = f.pre ?? ", "; return v ? (html ? esc(pre + v) : pre + v) : ""; }
    if (v) return html ? esc(v) : v;
    const ph = "[" + (f.ph || (f.t === "date" ? "Datum" : f.t === "time" ? "Uhrzeit" : f.l)) + "]";
    return html ? `<span class="ph">${esc(ph)}</span>` : ph;
  });
}
function itemText(it, html) {
  const s = st(it.id);
  if (it.opts) { const o = it.opts.find(o => o.id === s.opt); return o ? render(o.tpl, o.f, html) : ""; }
  return render(it.tpl, it.f, html);
}
function itemState(it) { const s = st(it.id); if (s.mode === "out") return "out"; if (s.mode === "in" && (!it.opts || s.opt)) return "in"; return "open"; }
function applyDefaults(v) {
  itemsFor(v).forEach(it => { const s = st(it.id); if (it.opts && s.opt && !it.opts.find(o => o.id === s.opt)) { s.opt = null; if (s.mode === "in") s.mode = null; } if (s.mode === null && it.def === "out") s.mode = "out"; if (s.mode === null && !it.opts && !it.def) s.mode = "in"; });
}

// ============================================================ UI
const $ = (sel) => document.querySelector(sel);
const view = $("#view"), stepsEl = $("#steps"), metaEl = $("#meta"), bar = $("#bar");

function draw() {
  const v = S.variant;
  const secs = v ? secsFor(v) : [];
  const total = secs.length + 1; // + Ausgabe
  // Kopf
  metaEl.innerHTML = v ? `<span class="chip">${VARIANTS[v].k} ${esc(VARIANTS[v].name)}</span>${S.komNr ? `<span>Kom ${esc(S.komNr)}</span>` : ""}` : "";
  stepsEl.innerHTML = "";
  if (v) {
    secs.forEach((sec, i) => {
      const its = itemsFor(v, sec.id); const open = its.filter(it => itemState(it) === "open").length;
      const b = document.createElement("button"); b.className = "step"; b.type = "button";
      if (S.step === i) b.setAttribute("aria-current", "step");
      b.innerHTML = `${esc(sec.name)} <span class="n ${open ? "open" : "done"}">${open ? open + " offen" : "✓"}</span>`;
      b.onclick = () => go(i); stepsEl.appendChild(b);
    });
    const b = document.createElement("button"); b.className = "step"; b.type = "button";
    if (S.step === secs.length) b.setAttribute("aria-current", "step");
    b.textContent = "Textbausteine"; b.onclick = () => go(secs.length); stepsEl.appendChild(b);
  }
  // Inhalt
  if (!v || S.choose) { stepsEl.innerHTML = ""; drawStart(); bar.hidden = true; return; }
  bar.hidden = false;
  if (S.step >= secs.length) { drawOutput(secs); }
  else drawSection(secs[S.step], S.step, secs.length);
  $("#btnPrev").textContent = S.step === 0 ? "Variante" : "Zurück";
  $("#btnNext").textContent = S.step >= secs.length ? "Fertig" : (S.step === secs.length - 1 ? "Textbausteine" : "Weiter");
  $("#btnNext").hidden = S.step >= secs.length;
  const allOpen = itemsFor(v).filter(it => itemState(it) === "open").length;
  $("#barStatus").textContent = S.step >= secs.length ? "" : `Schritt ${S.step + 1} von ${total} · ${allOpen ? allOpen + " Punkte offen" : "alle Punkte entschieden"}`;
}
function go(i) { S.step = i; save(); draw(); window.scrollTo({ top: 0 }); }

function drawStart() {
  view.innerHTML = `
    <h2>Welche Anlage?</h2>
    <p class="lead">Wähle die Variante. Danach gehst du die Bausitzung Betreff für Betreff durch, entscheidest pro Punkt «aufnehmen» oder «weglassen» und trägst die Angaben ein. Am Schluss bekommst du die fertigen Textbausteine zum Kopieren in MoreApp.</p>
    <div class="project">
      <div class="field pfield"><label for="komNr">Kom Nr. (optional)</label><input id="komNr" inputmode="numeric" placeholder="z. B. 20135803" value="${esc(S.komNr)}"></div>
      <div class="field pfield"><label for="projekt">Projekt / Adresse (optional)</label><input id="projekt" placeholder="z. B. Hochwangstrasse 5, Landquart" value="${esc(S.projekt)}"></div>
    </div>
    <div class="variants" id="variants"></div>
    ${hasDraft() ? `<div class="notice warn" style="margin-top:16px">Es gibt einen angefangenen Entwurf${S.komNr ? " (Kom " + esc(S.komNr) + ")" : ""}. Die gleiche Variante wählen führt ihn weiter; <button class="btn small" id="btnReset" type="button">Neu beginnen</button> löscht alle Eingaben.</div>` : ""}
  `;
  $("#komNr").oninput = e => { S.komNr = e.target.value; save(); };
  $("#projekt").oninput = e => { S.projekt = e.target.value; save(); };
  const vs = $("#variants");
  [1,2,3].forEach(n => {
    const b = document.createElement("button"); b.type = "button"; b.className = "vcard";
    b.innerHTML = `<span class="t"><span class="k">${VARIANTS[n].k}</span>${esc(VARIANTS[n].name)}</span><span class="d">${esc(VARIANTS[n].desc)}</span>`;
    b.onclick = () => { if (S.variant && S.variant !== n) { S.items = {}; } S.variant = n; S.choose = false; applyDefaults(n); S.step = 0; save(); draw(); window.scrollTo({ top: 0 }); };
    vs.appendChild(b);
  });
  const r = $("#btnReset"); if (r) r.onclick = () => { S = blank(); save(); draw(); };
}
function hasDraft() { return Object.keys(S.items).length || Object.keys(S.fields).length; }

function fieldHtml(k, it) {
  const f = F[k]; const id = `f-${it.id}-${k}`; const val = S.fields[k] ?? (f.d ?? "");
  let ctrl;
  if (f.t === "select") ctrl = `<select id="${id}" data-k="${k}">${f.o.map(o => `<option ${o === (S.fields[k] ?? f.o[0]) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.t === "textarea") ctrl = `<textarea id="${id}" data-k="${k}" placeholder="${esc(f.hint || "")}">${esc(val)}</textarea>`;
  else ctrl = `<input id="${id}" data-k="${k}" type="${f.t || "text"}" ${f.t === "number" ? 'inputmode="decimal"' : ""} placeholder="${esc(f.hint || f.ph || "")}" value="${esc(String(val))}">`;
  return `<div class="field ${f.wide ? "wide" : ""}"><label for="${id}">${esc(f.l)}</label>${ctrl}</div>`;
}

function drawSection(sec, idx, n) {
  const v = S.variant; const its = itemsFor(v, sec.id);
  const intro = { org: "Was der Bauherr / die Verwaltung bereitstellt.", dem: "Rückbau, Mulde, Abdecken, Vorarbeiten im Schacht.", ele: "Steht teilweise auch im Dispoplan, geht aber gerne vergessen.", bau: "Wie Demonteur, ohne Demontage. Staubschleuse nicht vergessen.", sch: "Lastträger vor der Demontage, Aufmass, Blenden.", mal: "Ölanstrich Maschinenraum und Schachtgrube.", gip: "Zargen und alte Öffnungen.", hin: "Optional. Standardtexte, die du ans Ende des Protokolls stellen kannst." }[sec.id] || "";
  let h = `<h2>${idx + 1}. Besprechungsnotiz – ${esc(sec.name)}</h2><p class="lead">${esc(intro)}</p><div class="items">`;
  its.forEach(it => {
    const s = st(it.id); const state = itemState(it);
    h += `<div class="item ${s.mode === "out" ? "out" : ""} ${state === "open" ? "open-state" : ""} ${it.star ? "star" : ""}" data-id="${it.id}">
      <div class="item-h"><div class="l">${esc(it.l)}${it.hint ? `<small>${esc(it.hint)}</small>` : ""}</div>
        <div class="seg"><button type="button" class="${s.mode === "in" ? "on-in" : ""}" data-mode="in">Aufnehmen</button><button type="button" class="${s.mode === "out" ? "on-out" : ""}" data-mode="out">Weglassen</button></div></div>`;
    if (it.opts) {
      h += `<div class="opts">` + it.opts.map(o => `<label class="opt ${s.opt === o.id ? "sel" : ""}"><input type="radio" name="opt-${it.id}" value="${o.id}" ${s.opt === o.id ? "checked" : ""}><span><span class="ol">${esc(o.l)}</span>${o.d ? `<br><span class="od">${esc(o.d)}</span>` : ""}</span></label>`).join("") + `</div>`;
    }
    const fkeys = it.opts ? ((it.opts.find(o => o.id === s.opt) || {}).f || []) : (it.f || []);
    if (fkeys.length) h += `<div class="fields">${fkeys.map(k => fieldHtml(k, it)).join("")}</div>`;
    const txt = itemText(it, true);
    if (txt) h += `<div class="preview">${txt}</div>`;
    h += `</div>`;
  });
  h += `</div>`;
  // Eigene Zeilen
  const cs = S.custom[sec.id] || [];
  h += `<div class="custom" style="margin-top:10px"><div class="eyebrow">Eigene Zeile für ${esc(sec.name)}</div>
    ${cs.length ? `<div class="customs">${cs.map((c, i) => `<div class="cline"><span>${esc(c)}</span><button type="button" class="btn small ghost" data-del="${i}">Löschen</button></div>`).join("")}</div>` : ""}
    <textarea id="customIn" placeholder="Kleine Ergänzung, die nur bei diesem Projekt gilt …"></textarea>
    <div><button type="button" class="btn small" id="customAdd">Zeile hinzufügen</button></div></div>`;
  view.innerHTML = h;

  // Events
  view.querySelectorAll(".item").forEach(card => {
    const it = ITEMS.find(x => x.id === card.dataset.id); const s = st(it.id);
    card.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { s.mode = b.dataset.mode; if (s.mode === "in" && it.opts && !s.opt && it.opts.length === 1) s.opt = it.opts[0].id; save(); redraw(); });
    card.querySelectorAll(`input[type=radio]`).forEach(r => r.onchange = () => { s.opt = r.value; s.mode = "in"; save(); redraw(); });
    card.querySelectorAll("[data-k]").forEach(inp => {
      const upd = () => { S.fields[inp.dataset.k] = inp.value; save(); const pv = card.querySelector(".preview"); if (pv) pv.innerHTML = itemText(it, true); syncField(inp.dataset.k, inp); };
      inp.oninput = upd; inp.onchange = upd;
    });
  });
  $("#customAdd").onclick = () => { const t = $("#customIn").value.trim(); if (!t) return; (S.custom[sec.id] = S.custom[sec.id] || []).push(t); save(); redraw(); };
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.custom[sec.id].splice(+b.dataset.del, 1); save(); redraw(); });
}
// gleiches Feld in anderen Karten mitziehen (z. B. Kernbohrung bei Demonteur und Baumeister)
function syncField(k, src) {
  view.querySelectorAll(`[data-k="${k}"]`).forEach(o => { if (o !== src) { o.value = src.value; const card = o.closest(".item"); const it = ITEMS.find(x => x.id === card.dataset.id); const pv = card.querySelector(".preview"); if (pv) pv.innerHTML = itemText(it, true); } });
}
function redraw() { const y = window.scrollY; draw(); window.scrollTo({ top: y }); }

function outputBlocks(secs) {
  return secs.map(sec => {
    const lines = itemsFor(S.variant, sec.id).filter(it => itemState(it) === "in").map(it => itemText(it, false)).filter(Boolean);
    (S.custom[sec.id] || []).forEach(c => lines.push(c));
    return { sec, lines };
  }).filter(b => b.lines.length);
}
function drawOutput(secs) {
  const blocks = outputBlocks(secs);
  const open = itemsFor(S.variant).filter(it => itemState(it) === "open");
  const missing = blocks.reduce((n, b) => n + b.lines.filter(l => /\[[^\]]+\]/.test(l)).length, 0);
  let h = `<h2>Textbausteine${S.komNr ? ` · Kom ${esc(S.komNr)}` : ""}</h2>
    <p class="lead">${VARIANTS[S.variant].k} ${esc(VARIANTS[S.variant].name)}${S.projekt ? " · " + esc(S.projekt) : ""}. Pro Betreff eine Besprechungsnotiz in MoreApp; jede Zeile ist ein Eintrag «Beschreibung Notizen».</p>`;
  if (open.length) h += `<div class="notice warn">${open.length} Punkt${open.length > 1 ? "e" : ""} noch nicht entschieden: ${open.map(it => esc(it.l)).join(", ")}. Diese fehlen unten.</div>`;
  if (missing) h += `<div class="notice warn">${missing} Zeile${missing > 1 ? "n" : ""} enthalten noch Platzhalter in [eckigen Klammern].</div>`;
  if (!open.length && !missing) h += `<div class="notice good">Alle Punkte entschieden, keine offenen Platzhalter.</div>`;
  h += `<div class="rowbtns"><button type="button" class="btn primary" id="copyAll">Alles kopieren</button><button type="button" class="btn" id="btnEdit">Zurück zum Bearbeiten</button><button type="button" class="btn ghost" id="btnNew">Neues Protokoll</button></div><div id="confirmNew"></div>`;
  blocks.forEach((b, bi) => {
    h += `<div class="out-sec"><div class="out-h"><div class="t">${bi + 1}. ${esc(b.sec.name)}<small>${b.lines.length} Zeile${b.lines.length > 1 ? "n" : ""}</small></div><button type="button" class="btn small" data-copysec="${b.sec.id}">Betreff kopieren</button></div><div class="lines">`;
    b.lines.forEach((l, i) => { h += `<div class="line"><span class="n">${i + 1}</span><span class="tx">${esc(l).replace(/\[[^\]]+\]/g, m => `<span class="ph">${m}</span>`)}</span><button type="button" class="btn small ghost cp" data-copy="${bi}:${i}">Kopieren</button></div>`; });
    h += `</div></div>`;
  });
  if (!blocks.length) h += `<div class="notice warn">Noch keine Zeilen aufgenommen.</div>`;
  view.innerHTML = h;
  const secText = (b) => b.lines.join("\n");
  const allText = blocks.map((b, i) => `${i + 1}. ${b.sec.name}\n${secText(b)}`).join("\n\n");
  $("#copyAll").onclick = (e) => copy(allText, e.currentTarget);
  $("#btnEdit").onclick = () => go(0);
  $("#btnNew").onclick = () => { $("#confirmNew").innerHTML = `<div class="notice warn confirm">Alle Eingaben löschen und neu beginnen? <button type="button" class="btn small" id="yesNew">Ja, löschen</button><button type="button" class="btn small ghost" id="noNew">Abbrechen</button></div>`; $("#yesNew").onclick = () => { S = blank(); save(); draw(); window.scrollTo({ top: 0 }); }; $("#noNew").onclick = () => $("#confirmNew").innerHTML = ""; };
  view.querySelectorAll("[data-copysec]").forEach(b => b.onclick = (e) => copy(secText(blocks.find(x => x.sec.id === b.dataset.copysec)), e.currentTarget));
  view.querySelectorAll("[data-copy]").forEach(b => b.onclick = (e) => { const [bi, i] = b.dataset.copy.split(":").map(Number); copy(blocks[bi].lines[i], e.currentTarget); });
}
function copy(text, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = "Kopiert"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1400); };
  const fb = () => { const ta = $("#fallback"); ta.value = text; ta.style.left = "0"; ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.style.left = "-9999px"; if (ok) done(); else { btn.textContent = "Text markieren"; } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb); else fb();
}

$("#btnPrev").onclick = () => { if (S.step === 0) { S.choose = true; save(); draw(); window.scrollTo({ top: 0 }); } else go(S.step - 1); };
$("#btnNext").onclick = () => go(S.step + 1);

// Start: Variante gewählt → weiter; sonst Startseite. Bei zurück zur Variantenwahl bleibt der Entwurf erhalten.
if (S.variant) applyDefaults(S.variant);
